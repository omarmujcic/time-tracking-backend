spring:
  application:
    name: time-tracking-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/time_tracking}
    username: ${DB_USERNAME:time_tracking_user}
    password: ${DB_PASSWORD:time_tracking_password}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-this-secret-before-production}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
